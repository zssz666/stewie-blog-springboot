spring:
  application:
    name: stewie-blog-spring
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8081
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.stewie.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# JWT 配置（阶段 4 认证授权）
# 生产环境务必通过环境变量 JWT_SECRET 覆盖默认值，避免密钥泄露
jwt:
  secret: ${JWT_SECRET:stewie-blog-default-jwt-secret-please-change-me-in-production-2026}
  expiration: 86400000   # 令牌有效期（毫秒），默认 24 小时

# Knife4j 公共配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.stewie.blog.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# 文件上传（封面图），生产建议用环境变量 UPLOAD_DIR 指向持久化路径
upload:
  path: ${UPLOAD_DIR:./uploads}
  url-prefix: /uploads
