spring:
  application:
    name: stewie-blog-spring
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8081
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.stewie.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# JWT 配置（阶段 4 认证授权）
# 生产环境务必覆盖默认值：可用环境变量 JWT_SECRET，或在 JAR 同目录 application.yml 写 jwt.secret
jwt:
  secret: ${JWT_SECRET:stewie-blog-default-jwt-secret-please-change-me-in-production-2026}
  expiration: 86400000   # 令牌有效期（毫秒），默认 24 小时

# Knife4j 公共配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.stewie.blog.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# 腾讯云 COS 对象存储（封面图上传，公有读私有写）
# 凭证注入方式三选一：
#   1) 环境变量 COS_SECRET_ID / COS_SECRET_KEY（java -jar 前 export）
#   2) JAR 同目录放 application.yml 直接写 cos.secret-id / cos.secret-key（需与启动工作目录一致，否则读不到）
#   3) 直接写在 application-dev.yml（dev profile 始终激活，最稳，见该文件末尾）
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket: stewie-blog-1412052351
  region: ap-chengdu
  # 公有读基础地址，上传后直接可访问
  base-url: https://stewie-blog-1412052351.cos.ap-chengdu.myqcloud.com
  # 桶内目录前缀（可选，便于归类）
  prefix: covers

# 本地文件上传（COS 未配置时的降级方案，并保留对旧本地封面图的兼容）
upload:
  path: ${UPLOAD_DIR:./uploads}
  url-prefix: /uploads

# Bing IndexNow：内容发布/更新/删除时主动推送 URL，搜索引擎立刻来抓
# 密钥文件需与 key 同名且公开可访问：https://stewie.fun/<key>.txt（内容即密钥本身）
# 前端密钥文件：Stewie-blog/public/c9bc4d5ac49a48b99a700c4a1bd42dc9.txt
indexnow:
  enabled: ${INDEXNOW_ENABLED:true}
  host: ${INDEXNOW_HOST:stewie.fun}
  site-url: ${INDEXNOW_SITE_URL:https://stewie.fun}
  key: ${INDEXNOW_KEY:c9bc4d5ac49a48b99a700c4a1bd42dc9}
  key-location: ${INDEXNOW_KEY_LOCATION:https://stewie.fun/c9bc4d5ac49a48b99a700c4a1bd42dc9.txt}
  # 官方多引擎端点，一次推送同步给 Bing / Yandex / Seznam / Naver 等参与方
  endpoint: ${INDEXNOW_ENDPOINT:https://api.indexnow.org/indexnow}
