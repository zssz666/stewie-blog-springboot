# 开发/部署环境配置
# ⚠️ 安全约定：本文件严禁写入任何真实密钥（GitHub 推送保护会拦截并拒绝推送）。
#    所有密钥一律通过环境变量在运行时注入，详见下方 ${VAR:} 占位。
#    - 本地开发：在 IDEA 运行配置的 Environment variables 中填写
#    - 服务器部署：启动 jar 前 export 这些变量，或写进启动脚本
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://sh-cynosdbmysql-grp-qgd1k7we.sql.tencentcdb.com:22959/stewie_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 手动执行 stewie_blog_init.sql 后，baseline=2 让 Flyway 跳过 V1/V2，后续迁移从 V3 起
    baseline-version: 2
    encoding: UTF-8

logging:
  level:
    root: INFO
    com.stewie.blog: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ===== 腾讯云 COS 上传凭证（通过环境变量注入）=====
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}

# JWT 密钥（通过环境变量注入）
jwt:
  secret: ${JWT_SECRET:}


